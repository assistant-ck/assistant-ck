name: Build Test

on:
  workflow_dispatch:
    inputs:
      branch:
        description: '分支'
        default: 'refactor'
        required: true
      release_tag:
        description: 'tag'
        required: true

jobs:
  build:
    runs-on: macos-latest
    env:
      NUITKA_AssumeYesForDownloads: 1

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        repository: ${{ secrets.PRIVATE_REPO_NAME }}
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        ref: ${{ inputs.branch }}

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install uv
        uv pip install --system -r pyproject.toml
        pip install nuitka

    - name: Build App
      run: python scripts/build_macos.py

    - name: Create Zip
      run: |
        cd out
        zip -r "${{ secrets.APP_NAME_EN }}-macOS.zip" "${{ secrets.APP_NAME_ZH }}.app"

    - name: Upload to Private Release
      uses: softprops/action-gh-release@v1
      with:
        repository: ${{ secrets.PRIVATE_REPO_NAME }}
        token: ${{ secrets.PRIVATE_REPO_TOKEN }}
        tag_name: ${{ inputs.release_tag }}
        files: out/${{ secrets.APP_NAME_EN }}-macOS.zip

    - name: Bark Notification
      if: always()
      run: curl "https://api.day.app/${{ secrets.BARK_KEY }}/macOSBuild/${{ job.status }}"
